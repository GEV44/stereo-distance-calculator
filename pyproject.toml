[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "stereo-gamma"
version = "2.1.0"
description = "Metric distance from a calibrated stereo pair with a per-camera Γ-grid lens model — pure NumPy, analytic gradients."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Gevorg" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]
keywords = ["stereo vision", "camera calibration", "triangulation", "depth estimation", "computer vision"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

[project.optional-dependencies]
app = ["pygame>=2.5"]
collect = ["opencv-python>=4.8"]
demo = ["pygame>=2.5", "matplotlib>=3.7"]
dev = ["pytest>=7", "ruff>=0.4", "matplotlib>=3.7", "pygame>=2.5"]

[project.scripts]
stereo-gamma = "stereo_gamma.cli:main"

[project.urls]
Repository = "https://github.com/GEV44/stereo-distance-calculator"

[tool.setuptools]
packages = ["stereo_gamma"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["tests/v1_reference.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741", "B905"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]  # long f-strings build the Markdown report tables
